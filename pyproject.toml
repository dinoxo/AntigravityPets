[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-pets"
version = "1.0.0"
description = "Animated desktop companion system for Google Antigravity"
readme = "AGENTS.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
]

[project.scripts]
antigravity-pets = "desktop_py.app:main"
